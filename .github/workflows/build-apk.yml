name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/ApexTelemetry-v2.2.1.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexTelemetry-v2.2.1-apk
          path: release-apk/ApexTelemetry-v2.2.1.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.2.1
          name: "ApexTelemetry v2.2.1 - Ride Intelligence Suite"
          body: |
            ### 🏍️ ApexTelemetry v2.2.1 (Ride Intelligence & Analysis Suite)
            Professional Motorcycle Telemetry, Post-Ride Route Replay & Analytics (Optimized for Samsung Galaxy S20 FE).

            #### What's in v2.2.1:
            1. **Interactive Route Replay & Track Map:** 2D GPS track visualization with scrubber slider (Play/Pause/2x Speed) colored by cornering intensity.
            2. **Synchronized Telemetry Trace Charts:** Dual Canvas chart mapping Speed (km/h) and Lean Angle (Left vs Right) side-by-side with interactive scrub cursor.
            3. **Acceleration & Hard Braking Event Detection:** Automatically catalogs hard braking events (< -0.55g) and corner apexes.
            4. **Elevation & Heading Intelligence:** Total elevation climb (meters), altitude profile, and compass bearing tracking.
            5. **Rider Scorecard:** Fluidity & cornering smoothness rating (0-100) and left vs right turn breakdown.
            6. **Multi-Format Export Engine:**
               - **GPX** (with elevation, speed, course tags for Strava/Garmin/Google Earth)
               - **KML** (Google Earth 3D flyover path)
               - **CSV** (Data science spreadsheet with timestamps, coordinates, lean, G-force, speed, and heading)

            **Download & Install:**
            Download `ApexTelemetry-v2.2.1.apk` below and open it on your Android phone.
          files: release-apk/ApexTelemetry-v2.2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
