name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/ApexTelemetry-v1.2.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexTelemetry-v1.2.0-apk
          path: release-apk/ApexTelemetry-v1.2.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.0
          name: "ApexTelemetry v1.2.0 - Speedometer∞ Display Cluster & Inversion Fix"
          body: |
            ### 🏍️ ApexTelemetry v1.2.0 (Speedometer 55 / Speedometer∞ Edition)
            Motorcycle Lean & G-Force Telemetry HUD (Optimized for Samsung Galaxy S20 FE).

            #### What's New in v1.2.0:
            - **Direction Reversed Fix:** Leaning right sweeps right (+), leaning left sweeps left (-).
            - **On-Screen Direction Invert Toggle:** Direct toggle `[ DIR: NORMAL / INVERTED ]` for inverted mountings.
            - **4 Distinct Gauge Cluster Displays (Speedometer∞ reference):**
              1. **Digital Moto:** Modern MotoGP telemetry arc with segmented sweep and digital readouts.
              2. **Analog Dial:** Classic physical round gauge cluster with sweeping needle, tick marks, and persistent peak needles.
              3. **Rally Twin:** Dual binnacle instruments (Left: Roll Angle Dial, Right: Speedometer Dial).
              4. **HUD Mirror Mode:** Windshield mirror reflection projection mode (flipped horizontally) for night riding.
            - **Theme Engine:** Integrated across all 4 gauge clusters.
            - **Ride Recording & Saved Logs:** Start/Pause/Finish ride sessions with local persistence.

            **Download & Install:**
            Download `ApexTelemetry-v1.2.0.apk` below and open it on your Android phone.
          files: release-apk/ApexTelemetry-v1.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
