name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/ApexTelemetry-v2.1.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexTelemetry-v2.1.0-apk
          path: release-apk/ApexTelemetry-v2.1.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.1.0
          name: "ApexTelemetry v2.1.0 - Reliability First Edition"
          body: |
            ### 🏍️ ApexTelemetry v2.1.0 (Reliability First Edition)
            Motorcycle Lean & G-Force Telemetry HUD (Optimized for Samsung Galaxy S20 FE).

            #### The 5 Pillars of Reliability in v2.1.0:
            1. **Sensor Health & GPS Quality:** Live meter displaying GPS accuracy in ±meters (HDOP), satellite lock status, and IMU update rate (Hz).
            2. **Reliable Ride Recording & Crash Recovery:** Write-Ahead Logging (WAL) saves in-flight ride points every 5 seconds to disk. If battery dies, phone overheats, or app crashes, the session is recovered on reboot.
            3. **GPS Speed & Distance Integration:** High-precision geodesic trip odometer (km/mi) and multipath spike rejection (>280 km/h).
            4. **Lean-Angle Validation & Manual Horizon Tare:** Aerospace 3D Quaternion gravity fusion with manual level confirmation.
            5. **Ride History & Export Engine:** 1-tap **GPX Export** (for Strava/Garmin/Google Earth) and **CSV Telemetry Export** (for MoTeC/Excel) via Android Share Sheet.

            **Download & Install:**
            Download `ApexTelemetry-v2.1.0.apk` below and open it on your Android phone.
          files: release-apk/ApexTelemetry-v2.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
