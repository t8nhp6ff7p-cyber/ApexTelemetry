name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/ApexTelemetry-v1.1.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexTelemetry-v1.1.0-apk
          path: release-apk/ApexTelemetry-v1.1.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "ApexTelemetry v1.1.0 - Pro Ride Tracking"
          body: |
            ### 🏍️ ApexTelemetry v1.1.0 (Major Upgrade)
            Motorcycle Lean & G-Force Telemetry HUD (Optimized for Samsung Galaxy S20 FE).

            #### What's New in v1.1.0:
            - **Start / Pause / Finish Ride Session Workflow:** Telemetry only activates and logs when you start a ride.
            - **Aerospace 3D Quaternion Mount Calibration:** Pitch-decoupled matrix transformation fixes angle inaccuracy and eliminates handlebar tilt interference.
            - **Dynamic Cockpit Theme Engine:** Choose between MotoGP Cyan, Ducati Red, KTM Amber, Ninja Lime, and Stealth Sunlight.
            - **Saved Rides History:** Review past ride durations, peak cornering angles, top speeds, and braking G-forces.
            - **Enhanced AMOLED Layout:** Full auto-rotation with high 120Hz refresh rate responsiveness.

            **Download & Install:**
            Download `ApexTelemetry-v1.1.0.apk` below and open it on your Android phone.
          files: release-apk/ApexTelemetry-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
