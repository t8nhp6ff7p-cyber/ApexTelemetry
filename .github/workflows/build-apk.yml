name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/ApexTelemetry-v2.0.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexTelemetry-v2.0.0-apk
          path: release-apk/ApexTelemetry-v2.0.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0
          name: "ApexTelemetry v2.0.0 - Full-Fledged Application Revamp"
          body: |
            ### 🏍️ ApexTelemetry v2.0.0 (Full-Fledged Application Experience)
            Motorcycle Lean & G-Force Telemetry HUD (Optimized for Samsung Galaxy S20 FE).

            #### What's New in v2.0.0:
            - **True Immersive Sticky Fullscreen:** System bars and navigation pill hidden for an edge-to-edge 120Hz Super AMOLED cockpit.
            - **Options & Settings Drawer (☰):** Comprehensive slide-out menu for all cockpit customizations.
            - **Aerospace 3D Quaternion Gravity Fusion:** Fixed lean angle calculation with pitch decoupling and dynamic adaptive filtering.
            - **Dedicated Manual Calibration:** Removed forced auto-calibration on ride start; full manual "Tare Zero" control with 1-tap header shortcut.
            - **Configurable Max Lean Scale:** Choose between 45° (Cruiser/Street), 55° (Sport/Twisties), or 65° (Track/MotoGP).
            - **Trip Telemetry Tracking:** Moving Average Speed, Top Speed, Duration, Max L/R Lean, and G-Forces logged per ride.
            - **Speed Units:** Toggle between KM/H and MPH.
            - **Revamped Skeuomorphic Gauges:** Metallic brushed bezels, drop-glow needles, and illuminated tick marks across all 4 display styles (Classic Analog Dial, MotoGP Digital, Rally Twin Pods, and HUD Windshield Mirror).

            **Download & Install:**
            Download `ApexTelemetry-v2.0.0.apk` below and open it on your Android phone.
          files: release-apk/ApexTelemetry-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
