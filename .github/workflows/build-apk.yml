name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/ApexTelemetry-v1.0.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexTelemetry-v1.0.0-apk
          path: release-apk/ApexTelemetry-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "ApexTelemetry v1.0.0"
          body: |
            ### 🏍️ ApexTelemetry v1.0.0 for Android
            Motorcycle Lean & G-Force Telemetry HUD (Optimized for Samsung Galaxy S20 FE).

            #### Features:
            - Auto-Rotation support (Portrait & Landscape)
            - Live Lean Angle Gauge with Peak Hold
            - 2D G-Force Friction Radar (Braking & Cornering G)
            - GPS Speedometer & Top Speed
            - One-tap Mount Zero Calibration

            **Download & Install:**
            Download `ApexTelemetry-v1.0.0.apk` below and open it on your Android phone.
          files: release-apk/ApexTelemetry-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
